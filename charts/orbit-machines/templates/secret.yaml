{{- if not .Values.orbit.existingSecret -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "orbit-machines.secretName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "orbit-machines.labels" . | nindent 4 }}
type: Opaque
stringData:
  cluster-token: {{ .Values.orbit.clusterToken | quote }}
  signing-public-key: {{ .Values.orbit.signingPublicKey | quote }}
  signing-private-key: {{ .Values.orbit.signingPrivateKey | quote }}
  s3-access-key: {{ .Values.s3.accessKey | quote }}
  s3-secret-key: {{ .Values.s3.secretKey | quote }}
{{- end }}
