apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "orbit-machines.fullname" . }}-dispatcher
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "orbit-machines.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.dispatcher.replicaCount }}
  selector:
    matchLabels:
      {{- include "orbit-machines.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "orbit-machines.labels" . | nindent 8 }}
    spec:
      serviceAccountName: {{ include "orbit-machines.serviceAccountName" . }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: orbit-dispatcher
          image: "{{ .Values.dispatcher.image.repository }}:{{ .Values.dispatcher.image.tag }}"
          imagePullPolicy: {{ .Values.dispatcher.image.pullPolicy }}
          args:
            - "serve"
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          ports:
            - name: http
              containerPort: {{ .Values.dispatcher.service.port }}
              protocol: TCP
          env:
            - name: ORBIT_MACHINES_LISTEN_ADDR
              value: ":{{ .Values.dispatcher.service.port }}"
            - name: ORBIT_MACHINES_ORBIT_URL
              value: {{ .Values.orbit.url | quote }}
            - name: ORBIT_MACHINES_CLUSTER_ID
              value: {{ .Values.orbit.clusterId | quote }}
            - name: ORBIT_MACHINES_CLUSTER_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ include "orbit-machines.secretName" . }}
                  key: cluster-token
            - name: ORBIT_MACHINES_SIGNING_PUBLIC_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "orbit-machines.secretName" . }}
                  key: signing-public-key
            - name: ORBIT_MACHINES_SIGNING_PRIVATE_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "orbit-machines.secretName" . }}
                  key: signing-private-key
            - name: ORBIT_MACHINES_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: ORBIT_MACHINES_MACHINED_IMAGE
              value: "{{ .Values.machined.image.repository }}:{{ .Values.machined.image.tag }}"
            - name: ORBIT_MACHINES_DEFAULT_CPU
              value: {{ .Values.machined.defaultCPU | quote }}
            - name: ORBIT_MACHINES_DEFAULT_MEMORY
              value: {{ .Values.machined.defaultMemory | quote }}
            - name: ORBIT_MACHINES_WORKSPACE_STORAGE
              value: {{ .Values.machined.workspaceStorage | quote }}
            - name: ORBIT_MACHINES_NIX_STORE_STORAGE
              value: {{ .Values.machined.nixStoreStorage | quote }}
            - name: ORBIT_MACHINES_IDLE_TIMEOUT
              value: {{ .Values.dispatcher.idleTimeout | quote }}
            - name: ORBIT_MACHINES_RECONCILE_INTERVAL
              value: {{ .Values.dispatcher.reconcileInterval | quote }}
            - name: ORBIT_MACHINES_S3_ENDPOINT
              value: {{ include "orbit-machines.s3Endpoint" . | quote }}
            - name: ORBIT_MACHINES_S3_REGION
              value: {{ .Values.s3.region | quote }}
            - name: ORBIT_MACHINES_S3_USE_PATH_STYLE
              value: {{ .Values.s3.usePathStyle | quote }}
            - name: ORBIT_MACHINES_S3_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "orbit-machines.secretName" . }}
                  key: s3-access-key
            - name: ORBIT_MACHINES_S3_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "orbit-machines.secretName" . }}
                  key: s3-secret-key
            - name: ORBIT_MACHINES_S3_VAULT_BUCKET
              value: {{ .Values.s3.vaultBucket | quote }}
            - name: ORBIT_MACHINES_S3_GIT_WIP_BUCKET
              value: {{ .Values.s3.gitWipBucket | quote }}
            - name: ORBIT_MACHINES_S3_NIX_CACHE_BUCKET
              value: {{ .Values.s3.nixCacheBucket | quote }}
            - name: ORBIT_DISPATCHER_LISTEN_ADDR
              value: ":{{ .Values.dispatcher.service.port }}"
            - name: ORBIT_DISPATCHER_ORBIT_URL
              value: {{ .Values.orbit.url | quote }}
            - name: ORBIT_DISPATCHER_CLUSTER_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ include "orbit-machines.secretName" . }}
                  key: cluster-token
            - name: ORBIT_DISPATCHER_INGRESS_HOST
              value: {{ .Values.dispatcher.ingress.host | quote }}
            - name: ORBIT_DISPATCHER_KUBERNETES_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: ORBIT_DISPATCHER_MACHINE_IMAGE
              value: "{{ .Values.machined.image.repository }}:{{ .Values.machined.image.tag }}"
            - name: ORBIT_DISPATCHER_MAX_CONCURRENT_PODS
              value: {{ .Values.dispatcher.maxConcurrentPods | quote }}
            - name: ORBIT_DISPATCHER_HEARTBEAT_INTERVAL
              value: {{ .Values.dispatcher.heartbeatInterval | quote }}
            - name: ORBIT_DISPATCHER_S3_ENDPOINT
              value: {{ include "orbit-machines.s3Endpoint" . | quote }}
            - name: ORBIT_DISPATCHER_S3_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "orbit-machines.secretName" . }}
                  key: s3-access-key
            - name: ORBIT_DISPATCHER_S3_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "orbit-machines.secretName" . }}
                  key: s3-secret-key
            - name: ORBIT_DISPATCHER_S3_PROFILE_BUCKET
              value: {{ .Values.s3.profileBucket | quote }}
            - name: ORBIT_DISPATCHER_S3_NIX_CACHE_BUCKET
              value: {{ .Values.s3.nixCacheBucket | quote }}
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 3
            periodSeconds: 10
          resources:
            {{- toYaml .Values.dispatcher.resources | nindent 12 }}
