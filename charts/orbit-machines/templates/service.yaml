apiVersion: v1
kind: Service
metadata:
  name: {{ include "orbit-machines.fullname" . }}-dispatcher
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "orbit-machines.labels" . | nindent 4 }}
spec:
  type: {{ .Values.dispatcher.service.type }}
  ports:
    - port: {{ .Values.dispatcher.service.port }}
      targetPort: http
      protocol: TCP
      name: http
  selector:
    {{- include "orbit-machines.selectorLabels" . | nindent 4 }}
