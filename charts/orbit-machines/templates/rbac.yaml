apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "orbit-machines.fullname" . }}-dispatcher
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "orbit-machines.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: [""]
    resources: ["pods/log"]
    verbs: ["get", "list"]
  - apiGroups: [""]
    resources: ["persistentvolumeclaims"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "orbit-machines.fullname" . }}-dispatcher
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "orbit-machines.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io/v1
  kind: Role
  name: {{ include "orbit-machines.fullname" . }}-dispatcher
subjects:
  - kind: ServiceAccount
    name: {{ include "orbit-machines.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
